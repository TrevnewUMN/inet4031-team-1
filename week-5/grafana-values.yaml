---
# Lab 5, Task 3: Grafana in the monitoring namespace of the team1 cluster.
#   helm repo add grafana-community https://grafana-community.github.io/helm-charts
#   helm upgrade --install grafana grafana-community/grafana --version 13.7.0 \
#     --namespace monitoring -f week-5/grafana-values.yaml
# The admin password is generated by the chart and kept in the Secret "grafana"
# (key admin-password). It is never written to this repo.

# Sized for a VM shared by several teams. No volume: dashboards and the data
# source come from this file, so nothing is lost if the pod restarts.
persistence:
  enabled: false
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    # Grafana 13 needs more than 256Mi to start (it was OOM-killed at 256Mi).
    memory: 512Mi
testFramework:
  enabled: false

# Prometheus as the data source (the Prometheus server from the Wiki's Helm install).
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        isDefault: true
        jsonData:
          # Our Prometheus scrapes once a minute. Telling Grafana this makes
          # dashboard rate() windows wide enough to hold 2+ samples.
          timeInterval: 1m

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

# Community dashboard 1860 "Node Exporter Full" from grafana.com.
# It picks the default Prometheus data source on its own.
dashboards:
  default:
    node-exporter-full:
      gnetId: 1860
      revision: 45
