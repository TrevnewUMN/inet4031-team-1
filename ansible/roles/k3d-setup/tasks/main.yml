
---
# Week 3 - k3d Kubernetes cluster setup

- name: Check operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Linux'
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: "This role currently supports Linux x86_64 only."

- name: Check whether k3d is installed
  ansible.builtin.command: k3d version
  register: k3d_check
  changed_when: false
  failed_when: false

- name: Install k3d if missing
  ansible.builtin.get_url:
    url: "https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64"
    dest: /usr/local/bin/k3d
    mode: "0755"
  become: true
  when: k3d_check.rc != 0

- name: Check Docker availability
  ansible.builtin.command: docker info
  changed_when: false

- name: Check existing k3d clusters
  ansible.builtin.command: k3d cluster list -o json
  register: existing_clusters
  changed_when: false

- name: Create Team 1 cluster if missing
  ansible.builtin.command:
    argv:
      - k3d
      - cluster
      - create
      - team1
      - --servers
      - "1"
      - --agents
      - "2"
      - --k3s-arg
      - "--disable=traefik@server:0"
  when: >-
    'team1' not in
    (existing_clusters.stdout | from_json |
    map(attribute='name') | list)

